name: Bug report
description: Report a reproducible problem using synthetic data where possible
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Never include API keys, captured images, logs, databases, or private configuration. Use private vulnerability reporting for security issues."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Python version, Stack version, and hardware if relevant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and synthetic input
      description: Include the smallest command or synthetic case that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
