[project]
name = "posture"
version = "3.1.0"
description = "A privacy-first macOS menu bar posture monitor"
requires-python = "==3.12.*"
dependencies = [
    "mediapipe==1.0.0",
    "opencv-python==5.0.0.93",
    "google-genai==2.14.0",
    "rumps==0.4.0",
    "pyobjc-framework-Cocoa==11.1",
    "numpy==2.2.6",
]

[project.urls]
Homepage = "https://github.com/jessecmaddox3/stack-posture"
Repository = "https://github.com/jessecmaddox3/stack-posture"
Issues = "https://github.com/jessecmaddox3/stack-posture/issues"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posture"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["native_model: explicit test-only model integration using synthetic frames"]

[tool.ruff]
line-length = 100
